# We have a conf and classes directory, add to BBPATH. Prepended (not
# appended) so our classes/ override same-named upstream classes, e.g.
# classes/ros_ament_cmake.bbclass.
BBPATH =. "${LAYERDIR}:"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "df-common"
BBFILE_PATTERN_df-common := "^${LAYERDIR}/"
BBFILE_PRIORITY_df-common = "7"

LAYERDEPENDS_df-common = "core"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_df-common = "1"
LAYERSERIES_COMPAT_df-common = "scarthgap"

# Cortex-M4 Zephyr firmware: built in its own multiconfig (BBMULTICONFIG in
# local.conf), consumed by dontfall-m4-firmware on the A7 side.
DF_M4_MC = "zephyr-m4"
DF_M4_MACHINE = "stm32mp157c-dk2-m4"
DF_M4_TMPDIR = "${TOPDIR}/tmp-zephyr-m4"
