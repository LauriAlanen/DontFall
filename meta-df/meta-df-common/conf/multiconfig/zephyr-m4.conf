# Multiconfig for the Cortex-M4 Zephyr firmware (enable with
# BBMULTICONFIG = "zephyr-m4" in local.conf). Builds e.g.
#   bitbake mc:zephyr-m4:dontfall-m4
# in its own TMPDIR next to the A7 build.
MACHINE = "${DF_M4_MACHINE}"
DISTRO = "zephyr"
TMPDIR = "${DF_M4_TMPDIR}"
# keep TMPDIR exactly DF_M4_TMPDIR (OE appends "-newlib" otherwise); the A7
# side reads the firmware from ${DF_M4_TMPDIR}/deploy
TCLIBCAPPEND = ""

# Zephyr 3.7 LTS - same commit as DontFall-M4/west.yml
PREFERRED_VERSION_zephyr-kernel = "3.7.0"
# Zephyr SDK (0.16.9) instead of an OE-built cross gcc: the M4 dev container
# uses the same SDK version.
ZEPHYR_TOOLCHAIN_VARIANT = "zephyr"

# local.conf's secure-boot signing (TF-A/FIP of the A7 machine) has no key for
# this machine and nothing here is signed; the A7 configuration keeps it.
SIGN_ENABLE = "0"
