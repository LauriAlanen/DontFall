# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "df-stm32mp157c-dk2"
BBFILE_PATTERN_df-stm32mp157c-dk2 := "^${LAYERDIR}/"
BBFILE_PRIORITY_df-stm32mp157c-dk2 = "8"

LAYERDEPENDS_df-stm32mp157c-dk2 = "stm-st-stm32mp"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_df-stm32mp157c-dk2 = "1"
LAYERSERIES_COMPAT_df-stm32mp157c-dk2 = "scarthgap"
