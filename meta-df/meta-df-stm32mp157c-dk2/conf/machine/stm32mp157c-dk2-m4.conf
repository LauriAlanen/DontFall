#@TYPE: Machine
#@NAME: stm32mp157c-dk2-m4
#@DESCRIPTION: Cortex-M4 coprocessor of the STM32MP157C-DK2, running Zephyr.
# Used only by the zephyr-m4 multiconfig (meta-df-common/conf/multiconfig).
# Deliberately not named stm32mp157c-dk2: meta-zephyr-bsp ships a machine of
# that name, and the A7 machine already owns it.

require conf/machine/include/arm/armv7m/tune-cortexm4.inc
TUNE_FEATURES = "armv7em cortexm4"

ARCH:stm32mp157c-dk2-m4 = "arm"
ZEPHYR_BOARD = "stm32mp157c_dk2"
