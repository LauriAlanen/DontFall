#@TYPE: Machine
#@NAME: stm32mp157c-dk2
#@DESCRIPTION: STM32MP157C-DK2 Discovery kit with Optee-min boot scheme and SDcard support
#@NEEDED_BSPLAYERS: layers/meta-st-stm32mp layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

# Define specific familly common machine name
MACHINEOVERRIDES =. "stm32mp1common:stm32mp15common:"

include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

# =========================================================================
# Chip architecture
# =========================================================================
DEFAULTTUNE = "cortexa7thf-neon-vfpv4"
include conf/machine/include/arm/armv7a/tune-cortexa7.inc

# =========================================================================
# boot scheme
# =========================================================================
BOOTSCHEME_LABELS += "opteemin"

# =========================================================================
# boot device
# =========================================================================
# Define the boot device supported
BOOTDEVICE_LABELS += "sdcard"

# =========================================================================
# Machine settings
# =========================================================================
# Define list of devicetree per supported storage
STM32MP_DT_FILES_SDCARD += "stm32mp157c-dk2"

# =========================================================================
# Machine features
# =========================================================================
MACHINE_FEATURES += "watchdog"
MACHINE_FEATURES += "wifi"
MACHINE_FEATURES += "${@'gpu' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
MACHINE_FEATURES += "m4copro"

# No InitRD: ST's st-image-resize-initrd only grows the rootfs to fill its
# partition on first boot, and the wic image already gives the rootfs its
# final size. The kernel mounts the root partition itself (MMC + ext4 are
# built in), which saves several seconds on every boot.
MACHINE_FEATURES:remove = "initrd autoresize"

# Boot the extlinux entry straight away, without the U-Boot menu.
# U-Boot prompts as soon as extlinux.conf has any MENU line, and the
# "splashscreen" machine feature (not set above) only adds one: MENU
# BACKGROUND. Without a prompt or DEFAULT, U-Boot boots the first (only)
# label. TIMEOUT 0 together with a prompt would wait forever.
UBOOT_EXTLINUX_TIMEOUT = "0"

# Every kernel and systemd status line goes synchronously to the 115200
# baud serial console, which slows the boot. "quiet" keeps only warnings
# and errors there; the full log is still in dmesg / journalctl.
UBOOT_EXTLINUX_KERNEL_ARGS:append = " quiet"
# Wifi
WIFI_LIST += "linux-firmware-addons-bcm43xx"

# =========================================================================
# Kernel modules
# =========================================================================
# ST installs all ~760 kernel modules (kernel-modules, 28 MB) and udev then
# loads every driver that matches the DK2 hardware at boot: bluetooth,
# audio, HDMI, ADC, ... Install only what the robot uses; the drivers'
# own dependencies (cfg80211, drm helpers, videobuf2, ...) come along.
# Watchdog, USB host, USB storage, MMC, ext4 and remoteproc are built in.
# A missing driver is a one-line add here.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "kernel-modules"
# A7 <-> M4 link (/dev/ttyRPMSG*) and the stm32 debug bus firewall
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-rpmsg-tty kernel-module-rpmsg-char \
    kernel-module-rpmsg-ctrl kernel-module-stm32-dbg-bus"
# WiFi (BCM43430 over SDIO) and networking used by systemd-networkd
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-brcmfmac kernel-module-brcmfmac-wcc \
    kernel-module-ipv6 kernel-module-sch-fq-codel kernel-module-ip-tables \
    kernel-module-nfnetlink"
# The robot's screen: DSI display + panel, touch, GPU
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-stm-drm kernel-module-dw-mipi-dsi-stm \
    kernel-module-panel-orisetech-otm8009a kernel-module-display-connector \
    kernel-module-edt-ft5x06 kernel-module-etnaviv"
# USB camera (UVC)
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-uvcvideo"

# =========================================================================
# M4 copro
# =========================================================================
# ST's stm32mp157c-dk2-{a7,m4}-examples device trees (and their extlinux
# boot entries) are not built: they belong to ST's demo software, the
# DontFall image boots stm32mp157c-dk2.dtb.
UBOOT_EXTLINUX_TARGETS_EXTRA_CONFIG[stm32mp157c-dk2] = ""

# Define specific board reference to use
M4_BOARDS = "STM32MP157C-DK2"

# M4COPRO_LIST feeds MACHINE_EXTRA_RRECOMMENDS for every image. ST's
# m4projects-stm32mp1 (CubeMP1 examples + loader service) is replaced by the
# DontFall Zephyr firmware (zephyr-m4 multiconfig) and its autostart service;
# m4fwcoredump stays for M4 crash dumps.
M4COPRO_LIST = "m4fwcoredump dontfall-m4-firmware"

# =========================================================================
# OPTEE
# =========================================================================
# For sdk generation, declare the default board configuration to use.
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp1common = "stm32mp157c-dk2.dts"

# =========================================================================
# ST EULA
# =========================================================================
# meta-st-stm32mp resolves the EULA text as conf/eula/${MACHINE} and ships no
# file for this machine name; reuse the DK2 one.
EULA_FILE_ST:stm32mp157c-dk2 = "${STM32MP_BASE}/conf/eula/stm32mp15-disco"

# =========================================================================
# WIC for sdcard raw image
# =========================================================================
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"
WKS_FILE_DEPENDS ?= " \
    virtual/bootloader \
    virtual/trusted-firmware-a \
    ${@bb.utils.contains('BOOTSCHEME_LABELS', 'optee', 'virtual-optee-os', '', d)} \
"
# the following wic file are provided as example to generate a raw image.
# Wic file configuration, request to have as minimul BOOTFS and USERFS activated
# To have a raw image which match with your usage, please create a new wic file by keeping the first
# stages (fsbl, fip, u-boot-env)
OPTEE_WIC_FILE = "${@bb.utils.contains('ST_VENDORFS','1','sdcard-stm32mp157c-dk2-optee-vendorfs-example.wks.in','sdcard-stm32mp157c-dk2-optee-example.wks.in',d)}"
OPTEEMIN_WIC_FILE = "${@bb.utils.contains('ST_VENDORFS','1','sdcard-stm32mp157c-dk2-opteemin-vendorfs-example.wks.in','sdcard-stm32mp157c-dk2-opteemin-example.wks.in',d)}"

# for generated a WIC file, please uncomment the 2 following lines or add them to local.conf
#WKS_IMAGE_FSTYPES += "wic wic.bz2 wic.bmap"
#WKS_FILE += "${OPTEE_WIC_FILE}"
#WKS_FILE += "${OPTEEMIN_WIC_FILE}"
